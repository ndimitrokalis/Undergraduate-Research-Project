spring.application.name=Streaming-Platform

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/streaming_platform
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000

# JWT
jwt.secret=c3RyZWFtaW5nLXBsYXRmb3JtLWRldi1zZWNyZXQta2V5LTI1Ni1iaXQtbG9uZw==
jwt.expiration=86400000

# WebSocket
websocket.allowed-origins=http://localhost:3000

# CORS
cors.allowed-origins=http://localhost:3000

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply.streamingplatform@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# App
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
