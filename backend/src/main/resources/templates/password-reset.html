<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 8px; }
        h1 { color: #141414; }
        .button { display: inline-block; padding: 12px 24px; background-color: #e50914; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        p { color: #333; line-height: 1.6; }
        .footer { margin-top: 30px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset your password</h1>
        <p>Hi <span th:text="${username}"></span>,</p>
        <p>We received a request to reset your password. Click the button below to choose a new password:</p>
        <p><a th:href="${resetLink}" class="button">Reset Password</a></p>
        <p>This link expires in 1 hour.</p>
        <p class="footer">If you did not request a password reset, you can safely ignore this email.</p>
    </div>
</body>
</html>
